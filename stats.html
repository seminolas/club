<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northland Badminton — Analytics</title>
<style>
:root{
  --bg:#0F1923;--sur:#162030;--card:#1A2B3C;--hi:#1E3248;
  --bdr:rgba(255,255,255,0.07);
  --acc:#F0C040;--adim:rgba(240,192,64,0.13);
  --win:#22D3A0;--loss:#F87171;
  --t1:#EDF2F7;--t2:#7A9AB5;--t3:#3D5568;
  --r:5px;
  --font:-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Cascadia Code','Fira Mono',ui-monospace,monospace;
}
@media(prefers-color-scheme:light){:root{
  --bg:#F0F4F8;--sur:#fff;--card:#fff;--hi:#EEF3F8;
  --bdr:rgba(0,0,0,0.08);
  --acc:#B07800;--adim:rgba(176,120,0,0.1);
  --win:#047857;--loss:#B91C1C;
  --t1:#0F1923;--t2:#4A6278;--t3:#94A3B8;
}}
:root[data-theme=light]{--bg:#F0F4F8;--sur:#fff;--card:#fff;--hi:#EEF3F8;--bdr:rgba(0,0,0,0.08);--acc:#B07800;--adim:rgba(176,120,0,0.1);--win:#047857;--loss:#B91C1C;--t1:#0F1923;--t2:#4A6278;--t3:#94A3B8;}
:root[data-theme=dark]{--bg:#0F1923;--sur:#162030;--card:#1A2B3C;--hi:#1E3248;--bdr:rgba(255,255,255,0.07);--acc:#F0C040;--adim:rgba(240,192,64,0.13);--win:#22D3A0;--loss:#F87171;--t1:#EDF2F7;--t2:#7A9AB5;--t3:#3D5568;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;height:50px;gap:14px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:15px;font-weight:700;letter-spacing:-.02em}
.hdr-logo em{color:var(--acc);font-style:normal}
.hdr-sp{flex:1}
.theme-btn{background:none;border:1px solid var(--bdr);color:var(--t2);cursor:pointer;border-radius:var(--r);padding:4px 10px;font-size:12px;font-family:var(--font)}
.tabs{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);transition:color .15s,border-color .15s}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.sec{max-width:1080px;margin:0 auto;padding:20px;display:none}
.sec.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px}
.card-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.card-val{font-size:26px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.card-sub{font-size:11px;color:var(--t3);margin-top:2px}
.tip{cursor:help;color:var(--t3);font-size:11px;border:1px solid var(--bdr);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:640px){.row2{grid-template-columns:1fr}}
.cc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cc-ttl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:12px}
.row2 .cc{margin-bottom:0}
canvas.ch{display:block;width:100%;height:155px}
canvas.ch-tall{display:block;width:100%;height:260px}
canvas.ch-sm{display:block;width:100%;height:100px}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:14px}
.rec{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:13px 15px}
.rec-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.rec-score{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--acc);margin-bottom:2px}
.rec-detail{font-size:11px;color:var(--t2)}
.sess-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.spick{padding:5px 13px;font-size:12px;font-weight:500;border:1px solid var(--bdr);background:var(--card);color:var(--t2);border-radius:var(--r);cursor:pointer;font-family:var(--font);transition:all .12s}
.spick:hover{color:var(--t1);border-color:var(--t2)}
.spick.on{background:var(--adim);color:var(--acc);border-color:var(--acc)}
.psearch-wrap{position:relative;margin-bottom:18px;max-width:320px}
.psearch{width:100%;background:var(--card);border:1px solid var(--bdr);color:var(--t1);font-family:var(--font);font-size:14px;padding:8px 12px;border-radius:var(--r);outline:none}
.psearch:focus{border-color:var(--acc)}
.psearch::placeholder{color:var(--t3)}
.pdrop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:200px;overflow-y:auto;z-index:10;display:none}
.popt{padding:8px 12px;cursor:pointer;font-size:13px;color:var(--t2)}
.popt:hover{background:var(--hi);color:var(--t1)}
.pdet{display:none}
.pdet.on{display:block}
.pname{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.dots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono)}
.dot.y{background:var(--adim);color:var(--acc);border:1.5px solid var(--acc)}
.dot.n{background:transparent;border:1.5px solid var(--bdr);color:var(--t3)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);text-align:left;padding:6px 9px;border-bottom:1px solid var(--bdr);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--t2)}
.tbl th.asc::after{content:' ↑';opacity:.9}
.tbl th.desc::after{content:' ↓';opacity:.9}
.tbl th:not(.asc):not(.desc)::after{content:' ↕';opacity:.3}
.tbl td{padding:7px 9px;color:var(--t2);border-bottom:1px solid var(--bdr);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--hi)}
.tbl td.nm{color:var(--t1);font-weight:500;white-space:normal}
.tbl td.wn{color:var(--win);font-weight:600}
.tbl td.ls{color:var(--loss)}
.tbl td.sc{color:var(--acc);font-family:var(--mono)}
/* bump filter */
.bump-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.qs-btn{padding:3px 10px;font-size:11px;font-weight:500;border:1px solid var(--bdr);background:var(--card);color:var(--t2);border-radius:var(--r);cursor:pointer;font-family:var(--font)}
.qs-btn:hover{color:var(--t1);border-color:var(--t2)}
.qs-btn.on{background:var(--adim);color:var(--acc);border-color:var(--acc)}
.bump-chips{display:flex;flex-wrap:wrap;gap:5px;max-height:90px;overflow-y:auto;margin-bottom:10px;padding:4px 0}
.chip{padding:2px 8px;font-size:11px;border:1px solid var(--bdr);background:var(--card);color:var(--t3);border-radius:20px;cursor:pointer;font-family:var(--font);transition:all .1s}
.chip.on{background:var(--adim);color:var(--acc);border-color:var(--acc)}
.chip:hover:not(.on){color:var(--t2);border-color:var(--t2)}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo">NB<em>·</em>Analytics</div>
  <div class="hdr-sp"></div>
  <button class="theme-btn" onclick="toggleTheme()">Toggle theme</button>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="ov">Overview</button>
  <button class="tab" data-tab="se">Sessions</button>
  <button class="tab" data-tab="pl">Players</button>
</nav>

<section id="s-ov" class="sec on"><div id="ov-ct"></div></section>
<section id="s-se" class="sec"><div id="se-ct"></div></section>
<section id="s-pl" class="sec">
  <div class="psearch-wrap">
    <input type="text" class="psearch" id="pi" placeholder="Search player…" autocomplete="off">
    <div class="pdrop" id="pd"></div>
  </div>
  <div class="pdet" id="pdet"></div>
</section>

<script>
// ── DATA SOURCE ────────────────────────────────────────────────────
let _D = null;
let STATS = null;

async function loadData() {
  try {
    const [sessRes, lbRes] = await Promise.all([
      fetch('https://club.northlandbadminton.co.nz/api/sessions'),
      fetch('https://club.northlandbadminton.co.nz/api/leaderboard')
    ]);
    const sessions = await sessRes.json();
    const leaderboard = await lbRes.json();
    _D = { sessions: Array.isArray(sessions) ? sessions : sessions.sessions || [], leaderboard };
  } catch(e) {
    document.getElementById('ov-ct').innerHTML = `<p style="color:var(--loss);padding:40px">Failed to load data: ${e.message}</p>`;
    return;
  }
  STATS = buildStats(_D);
  renderOv();
  setupSearch();
}

// ── PROCESSING ────────────────────────────────────────────────────
function fn(name) { return name ? name.split(' ')[0] : '?'; }

function buildStats(raw) {
  const {sessions, leaderboard} = raw;
  const pn = {};
  if (leaderboard && leaderboard.players) {
    leaderboard.players.forEach(p => { pn[p.id] = p.preferred_name || fn(p.name); });
  }
  const dates = [...sessions].map(s => s.date).sort();
  const allSets = [];
  const pst = {};
  const parst = {};
  const vsst = {};
  const rh = {};

  function ep(id, name) {
    if (!pst[id]) pst[id] = {w:0, l:0, ptsFor:0, ptsAgainst:0, sess:new Set(), box:{}};
    if (name && !pn[id]) pn[id] = fn(name);
  }

  sessions.forEach(s => {
    const {date, boxes} = s;
    (boxes || []).forEach((box, bi) => {
      const bx = bi + 1, ps = box.players || [];
      ps.forEach(p => { ep(p.id, p.name); pst[p.id].sess.add(date); pst[p.id].box[date] = bx; });
      (box.matches || []).forEach(m => {
        const p1 = (m.pair1 || []).map(i => ps[i] && ps[i].id).filter(Boolean);
        const p2 = (m.pair2 || []).map(i => ps[i] && ps[i].id).filter(Boolean);
        const k1 = [...p1].sort((a,b) => a-b).join(',');
        const k2 = [...p2].sort((a,b) => a-b).join(',');
        (m.sets || []).forEach(set => {
          const a = set[0], b = set[1];
          if (a === '' || a == null || b === '' || b == null) return;
          const s1 = +a, s2 = +b;
          if (isNaN(s1) || isNaN(s2)) return;
          const p1w = s1 > s2, mg = Math.abs(s1 - s2);
          allSets.push({date, bx, p1, p2, s1, s2, mg, tp: s1+s2});
          p1.forEach(id => {
            ep(id, null); p1w ? pst[id].w++ : pst[id].l++;
            pst[id].ptsFor += s1; pst[id].ptsAgainst += s2;
          });
          p2.forEach(id => {
            ep(id, null); p1w ? pst[id].l++ : pst[id].w++;
            pst[id].ptsFor += s2; pst[id].ptsAgainst += s1;
          });
          [{k:k1,ids:p1,won:p1w},{k:k2,ids:p2,won:!p1w}].forEach(({k,ids,won}) => {
            if (!k || !ids.length) return;
            if (!parst[k]) parst[k] = {ids, w:0, l:0};
            won ? parst[k].w++ : parst[k].l++;
          });
          p1.forEach(aid => p2.forEach(bid => {
            const ka = `${aid}_${bid}`, kb = `${bid}_${aid}`;
            if (!vsst[ka]) vsst[ka] = {w:0, l:0};
            if (!vsst[kb]) vsst[kb] = {w:0, l:0};
            if (p1w) { vsst[ka].w++; vsst[kb].l++; } else { vsst[ka].l++; vsst[kb].w++; }
          }));
        });
      });
    });
    if (s.leaderboardAfter) {
      s.leaderboardAfter.forEach((p, i) => { if (!rh[p.id]) rh[p.id] = {}; rh[p.id][date] = i+1; });
    } else if (s.leaderboardBefore) {
      s.leaderboardBefore.forEach((p, i) => { if (!rh[p.id]) rh[p.id] = {}; rh[p.id][date] = i+1; });
    }
  });

  const totPts = allSets.reduce((s, x) => s + x.tp, 0);
  const CAL_PER_PLAYER_SET = 45;
  const totCal = allSets.length * 4 * CAL_PER_PLAYER_SET;
  return {sessions, dates, pn, pst, parst, vsst, rh, allSets, totPts, totCal, CAL_PER_PLAYER_SET};
}

// ── CANVAS HELPERS ─────────────────────────────────────────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    const rad = Array.isArray(r) ? r[0] : r;
    this.moveTo(x+rad, y); this.lineTo(x+w-rad, y);
    this.quadraticCurveTo(x+w, y, x+w, y+rad); this.lineTo(x+w, y+h-rad);
    this.quadraticCurveTo(x+w, y+h, x+w-rad, y+h); this.lineTo(x+rad, y+h);
    this.quadraticCurveTo(x, y+h, x, y+h-rad); this.lineTo(x, y+rad);
    this.quadraticCurveTo(x, y, x+rad, y);
  };
}
function gv(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function sc(c) {
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  return {ctx, w, h};
}

// ── CHART: BARS ────────────────────────────────────────────────────
function drawBars(canvas, vals, labels, opts={}) {
  const {ctx, w, h} = sc(canvas);
  const {color=gv('--acc'), avg=null} = opts;
  const pd = {t:22, r:10, b:34, l:32};
  const cw = w-pd.l-pd.r, ch = h-pd.t-pd.b;
  const mx = Math.max(...vals) * 1.18 || 1;
  const gap = cw / vals.length, bw = gap * 0.6;
  [0,.25,.5,.75,1].forEach(f => {
    const y = pd.t+ch*(1-f);
    ctx.strokeStyle = gv('--bdr'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pd.l, y); ctx.lineTo(pd.l+cw, y); ctx.stroke();
    if (f > 0) {
      ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--mono')}`;
      ctx.textAlign = 'right'; ctx.fillText(Math.round(mx*f), pd.l-4, y+3);
    }
  });
  if (avg !== null) {
    const ay = pd.t+ch-ch*avg/mx;
    ctx.strokeStyle = gv('--acc'); ctx.setLineDash([4,4]); ctx.globalAlpha = .35; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pd.l, ay); ctx.lineTo(pd.l+cw, ay); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  vals.forEach((v, i) => {
    const x = pd.l+(i+.5)*gap-bw/2, bh = ch*v/mx, y = pd.t+ch-bh;
    ctx.fillStyle = color; ctx.globalAlpha = .85;
    ctx.beginPath(); ctx.roundRect(x, y, bw, bh, [3,3,0,0]); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = gv('--t1'); ctx.font = `bold 10px ${gv('--mono')}`; ctx.textAlign = 'center';
    ctx.fillText(v, x+bw/2, y-4);
    ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--font')}`;
    ctx.fillText(labels[i], x+bw/2, h-5);
  });
}

// ── CHART: HISTOGRAM (integer bins, % y-axis) ──────────────────────
function drawHist(canvas, vals, opts={}) {
  const {ctx, w, h} = sc(canvas);
  const {color=gv('--acc'), mn=0, mx=22, label='score'} = opts;
  const pd = {t:14, r:10, b:28, l:44};
  const cw = w-pd.l-pd.r, ch = h-pd.t-pd.b;
  const n = vals.length || 1;
  const range = mx - mn + 1;
  const bins = Array(range).fill(0);
  vals.forEach(v => {
    const idx = Math.round(+v) - mn;
    if (idx >= 0 && idx < range) bins[idx]++;
  });
  const pcts = bins.map(c => c / n * 100);
  const mxp = Math.ceil(Math.max(...pcts) * 1.15 / 5) * 5 || 5;
  const bw = cw / range;
  // Y grid at 5% intervals
  for (let p = 0; p <= mxp; p += 5) {
    const y = pd.t + ch*(1 - p/mxp);
    ctx.strokeStyle = gv('--bdr'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pd.l, y); ctx.lineTo(pd.l+cw, y); ctx.stroke();
    ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--mono')}`; ctx.textAlign = 'right';
    ctx.fillText(p+'%', pd.l-4, y+3);
  }
  // Bars
  bins.forEach((c, i) => {
    if (!c) return;
    const x = pd.l + i*bw + 0.5;
    const bh = ch * pcts[i] / mxp;
    const y = pd.t + ch - bh;
    ctx.fillStyle = color; ctx.globalAlpha = .82;
    ctx.fillRect(x, y, Math.max(1, bw-1), bh);
    ctx.globalAlpha = 1;
  });
  // X labels every 2
  ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--mono')}`; ctx.textAlign = 'center';
  for (let i = 0; i < range; i += 2) {
    ctx.fillText(mn+i, pd.l + (i+0.5)*bw, h-4);
  }
}

// ── CHART: BUMP ─────────────────────────────────────────────────────
function drawBump(canvas, ids, rh, pn, dates) {
  const {ctx, w, h} = sc(canvas);
  if (!ids.length) {
    ctx.fillStyle = gv('--t3'); ctx.font = `12px ${gv('--font')}`; ctx.textAlign = 'center';
    ctx.fillText('Select players above', w/2, h/2);
    return;
  }
  const pd = {t:22, r:120, b:10, l:20};
  const cw = w-pd.l-pd.r, ch = h-pd.t-pd.b;
  let maxR = 1;
  ids.forEach(id => dates.forEach(d => { const r = rh[id] && rh[id][d]; if (r && r > maxR) maxR = r; }));
  const xof = i => pd.l+(dates.length > 1 ? i/(dates.length-1) : 0.5)*cw;
  const yof = r => pd.t+((r-1)/(maxR-1||1))*ch;
  ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--font')}`; ctx.textAlign = 'center';
  dates.forEach((d, i) => ctx.fillText(d.slice(5), xof(i), 14));
  const hues = [40,195,320,160,270,20,230,100,350,140,300,60,210,0,250,90,180,315];
  ids.forEach((id, pi) => {
    const hue = hues[pi % hues.length];
    const col = `hsl(${hue},65%,60%)`;
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.globalAlpha = .7;
    ctx.beginPath(); let first = true;
    dates.forEach((d, i) => {
      const r = rh[id] && rh[id][d]; if (!r) return;
      first ? ctx.moveTo(xof(i), yof(r)) : ctx.lineTo(xof(i), yof(r)); first = false;
    });
    ctx.stroke(); ctx.globalAlpha = 1;
    dates.forEach((d, i) => {
      const r = rh[id] && rh[id][d]; if (!r) return;
      ctx.beginPath(); ctx.arc(xof(i), yof(r), 3, 0, Math.PI*2);
      ctx.fillStyle = col; ctx.fill();
    });
    const lr = rh[id] && rh[id][dates[dates.length-1]];
    if (lr) {
      ctx.fillStyle = col; ctx.font = `10px ${gv('--font')}`; ctx.textAlign = 'left';
      ctx.fillText(`${lr}. ${pn[id]||'?'}`, xof(dates.length-1)+8, yof(lr)+4);
    }
  });
}

// ── CHART: SPARKLINE (box trajectory) ─────────────────────────────
function drawSpark(canvas, vals, dates) {
  const {ctx, w, h} = sc(canvas);
  const valid = vals.filter(v => v !== null);
  if (valid.length < 1) return;
  const mn = Math.min(...valid), mx = Math.max(...valid), rng = mx-mn||1;
  const pd = {t:14, r:14, b:30, l:40};
  const cw = w-pd.l-pd.r, ch = h-pd.t-pd.b;
  const n = vals.length;
  const xof = i => pd.l+(n > 1 ? i/(n-1) : 0.5)*cw;
  const yof = v => pd.t+((v-mn)/rng)*ch;
  const uniq = [...new Set(valid)].sort((a,b) => a-b);
  uniq.forEach(v => {
    const y = yof(v);
    ctx.strokeStyle = gv('--bdr'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pd.l, y); ctx.lineTo(pd.l+cw, y); ctx.stroke();
    ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--mono')}`; ctx.textAlign = 'right';
    ctx.fillText(`Box ${v}`, pd.l-4, y+3);
  });
  const fi = vals.findIndex(v => v !== null);
  ctx.beginPath();
  ctx.moveTo(xof(fi), yof(vals[fi]));
  vals.forEach((v, i) => { if (v !== null) ctx.lineTo(xof(i), yof(v)); });
  ctx.lineTo(xof(n-1), pd.t+ch); ctx.lineTo(xof(fi), pd.t+ch); ctx.closePath();
  ctx.fillStyle = gv('--acc'); ctx.globalAlpha = .1; ctx.fill(); ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.strokeStyle = gv('--acc'); ctx.lineWidth = 2;
  let first = true;
  vals.forEach((v, i) => {
    if (v === null) { first = true; return; }
    first ? ctx.moveTo(xof(i), yof(v)) : ctx.lineTo(xof(i), yof(v)); first = false;
  });
  ctx.stroke();
  vals.forEach((v, i) => {
    if (v === null) return;
    ctx.beginPath(); ctx.arc(xof(i), yof(v), 4, 0, Math.PI*2);
    ctx.fillStyle = gv('--acc'); ctx.fill();
    ctx.beginPath(); ctx.arc(xof(i), yof(v), 2, 0, Math.PI*2);
    ctx.fillStyle = gv('--bg'); ctx.fill();
  });
  ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--font')}`; ctx.textAlign = 'center';
  dates.forEach((d, i) => { if (vals[i] !== null) ctx.fillText(d.slice(5), xof(i), h-4); });
}

// ── CHART: RANK LINE (single player) ──────────────────────────────
function drawRankLine(canvas, pid, rh, dates) {
  const {ctx, w, h} = sc(canvas);
  const pts = dates.map((d, i) => ({i, d, r: rh[pid] && rh[pid][d]}));
  const valid = pts.filter(p => p.r);
  if (valid.length < 1) {
    ctx.fillStyle = gv('--t3'); ctx.font = `11px ${gv('--font')}`; ctx.textAlign = 'center';
    ctx.fillText('No ranking data available', w/2, h/2);
    return;
  }
  const pd = {t:22, r:14, b:28, l:38};
  const cw = w-pd.l-pd.r, ch = h-pd.t-pd.b;
  const ranks = valid.map(p => p.r);
  const minR = Math.min(...ranks), maxR = Math.max(...ranks);
  const rng = maxR - minR || 1;
  const xof = i => pd.l+(dates.length > 1 ? i/(dates.length-1) : 0.5)*cw;
  // Invert: rank 1 at top
  const yof = r => pd.t + ((r - minR) / rng) * ch;

  // Grid + y-axis labels
  const uniqR = [...new Set(ranks)].sort((a,b) => a-b);
  uniqR.forEach(r => {
    const y = yof(r);
    ctx.strokeStyle = gv('--bdr'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pd.l, y); ctx.lineTo(pd.l+cw, y); ctx.stroke();
    ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--mono')}`; ctx.textAlign = 'right';
    ctx.fillText(`#${r}`, pd.l-4, y+3);
  });

  // Area fill
  const fi = pts.findIndex(p => p.r);
  ctx.beginPath();
  ctx.moveTo(xof(pts[fi].i), yof(pts[fi].r));
  pts.forEach(p => { if (p.r) ctx.lineTo(xof(p.i), yof(p.r)); });
  ctx.lineTo(xof(pts[pts.length-1].i), pd.t+ch);
  ctx.lineTo(xof(pts[fi].i), pd.t+ch);
  ctx.closePath();
  ctx.fillStyle = gv('--acc'); ctx.globalAlpha = .08; ctx.fill(); ctx.globalAlpha = 1;

  // Line
  ctx.beginPath(); ctx.strokeStyle = gv('--acc'); ctx.lineWidth = 2;
  let first = true;
  pts.forEach(p => {
    if (!p.r) { first = true; return; }
    first ? ctx.moveTo(xof(p.i), yof(p.r)) : ctx.lineTo(xof(p.i), yof(p.r));
    first = false;
  });
  ctx.stroke();

  // Dots + rank labels
  pts.forEach(p => {
    if (!p.r) return;
    ctx.beginPath(); ctx.arc(xof(p.i), yof(p.r), 4, 0, Math.PI*2);
    ctx.fillStyle = gv('--acc'); ctx.fill();
    ctx.beginPath(); ctx.arc(xof(p.i), yof(p.r), 2, 0, Math.PI*2);
    ctx.fillStyle = gv('--bg'); ctx.fill();
    ctx.fillStyle = gv('--t1'); ctx.font = `bold 9px ${gv('--mono')}`; ctx.textAlign = 'center';
    ctx.fillText(`#${p.r}`, xof(p.i), yof(p.r)-8);
  });

  // X date labels
  ctx.fillStyle = gv('--t3'); ctx.font = `9px ${gv('--font')}`; ctx.textAlign = 'center';
  dates.forEach((d, i) => ctx.fillText(d.slice(5), xof(i), h-4));
}

// ── SORTABLE TABLE UTILITY ─────────────────────────────────────────
const _sorts = {};
const _tblData = {};
const _tblCols = {};

function renderTbl(id) {
  const rows = _tblData[id] || [];
  const cols = _tblCols[id] || [];
  const sort = _sorts[id] || {col:0, dir:-1};
  const col = cols[sort.col];
  const sorted = [...rows].sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    return sort.dir * (typeof va === 'string' ? va.localeCompare(vb) : vb - va);
  });
  const ths = cols.map((c, i) => {
    const active = i === sort.col;
    const cls = active ? (sort.dir > 0 ? 'asc' : 'desc') : '';
    return `<th class="${cls}" onclick="tblSort('${id}',${i})">${c.label}</th>`;
  }).join('');
  const trs = sorted.map(r => `<tr>${cols.map(c => `<td class="${c.cls ? c.cls(r) : ''}">${c.fmt ? c.fmt(r) : c.val(r)}</td>`).join('')}</tr>`).join('');
  const el = document.getElementById(id);
  if (el) el.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr>${ths}</tr></thead><tbody>${trs || '<tr><td colspan="' + cols.length + '" style="color:var(--t3);padding:12px">No data</td></tr>'}</tbody></table></div>`;
}

function tblSort(id, colIdx) {
  const cur = _sorts[id] || {col:-1, dir:-1};
  // Same col: flip; new col: default desc (-1 = higher values first)
  _sorts[id] = {col: colIdx, dir: cur.col === colIdx ? -cur.dir : -1};
  renderTbl(id);
}

function setTbl(id, data, cols, defaultSortCol=0, defaultDir=-1) {
  _tblData[id] = data;
  _tblCols[id] = cols;
  _sorts[id] = {col: defaultSortCol, dir: defaultDir};
  renderTbl(id);
}

// ── BUMP FILTER STATE ──────────────────────────────────────────────
let _bumpSel = new Set();
let _bumpAll = [];
let _bumpActiveOnly = false;

function initBump() {
  const {rh, pn, pst, dates} = STATS;
  const lastD = dates[dates.length-1];
  // Players with rank data AND game data
  _bumpAll = Object.keys(rh)
    .filter(id => pst[+id] && Object.keys(rh[id]).length > 0)
    .map(id => ({
      id: +id,
      name: pn[+id] || `#${id}`,
      finalRank: rh[id][lastD] || 999,
      sessions: pst[+id] ? pst[+id].sess.size : 0
    }))
    .sort((a, b) => a.finalRank - b.finalRank);
  bumpQuick(15);
}

function bumpQuick(n) {
  const visible = _bumpActiveOnly ? _bumpAll.filter(p => p.sessions >= 3) : _bumpAll;
  _bumpSel = new Set(visible.slice(0, n).map(p => p.id));
  renderBumpChips();
  renderBumpChart();
}

function bumpToggle(id) {
  if (_bumpSel.has(id)) _bumpSel.delete(id); else _bumpSel.add(id);
  renderBumpChips();
  renderBumpChart();
}

function bumpSetActive(checked) {
  _bumpActiveOnly = checked;
  // Deselect players not passing the filter
  if (checked) {
    const activeIds = new Set(_bumpAll.filter(p => p.sessions >= 3).map(p => p.id));
    _bumpSel = new Set([..._bumpSel].filter(id => activeIds.has(id)));
  }
  renderBumpChips();
  renderBumpChart();
}

function renderBumpChips() {
  const el = document.getElementById('bump-chips');
  if (!el) return;
  const visible = _bumpActiveOnly ? _bumpAll.filter(p => p.sessions >= 3) : _bumpAll;
  el.innerHTML = visible.map(p =>
    `<button class="chip${_bumpSel.has(p.id)?' on':''}" onclick="bumpToggle(${p.id})">${p.finalRank < 900 ? p.finalRank+'. ' : ''}${p.name}</button>`
  ).join('');
}

function renderBumpChart() {
  const cv = document.getElementById('c-bump');
  if (!cv) return;
  const {rh, pn, dates} = STATS;
  const ids = _bumpAll.filter(p => _bumpSel.has(p.id)).map(p => p.id);
  drawBump(cv, ids, rh, pn, dates);
}

// ── VIEW: SESSION ───────────────────────────────────────────────────
let _curSessDate = null;

function renderSe(selDate) {
  const {sessions, dates, pn, allSets, CAL_PER_PLAYER_SET} = STATS;
  const sess = sessions.find(s => s.date === selDate) || sessions[sessions.length-1];
  _curSessDate = sess.date;
  const date = sess.date;

  // Player stats + pts for/against
  const sps = {};
  const sPts = {};
  (sess.boxes || []).forEach(box => {
    const ps = box.players || [];
    ps.forEach(p => { if (!sps[p.id]) sps[p.id] = {name:p.name, w:0, l:0}; });
    (box.matches || []).forEach(m => {
      const p1 = (m.pair1||[]).map(i => ps[i]&&ps[i].id).filter(Boolean);
      const p2 = (m.pair2||[]).map(i => ps[i]&&ps[i].id).filter(Boolean);
      (m.sets||[]).forEach(set => {
        const a = set[0], b = set[1];
        if (a===''||a==null||b===''||b==null) return;
        const [s1,s2] = [+a,+b]; if (isNaN(s1)||isNaN(s2)) return;
        const p1w = s1>s2;
        p1.forEach(id => {
          if (!sps[id]) sps[id]={name:'',w:0,l:0};
          p1w ? sps[id].w++ : sps[id].l++;
          if (!sPts[id]) sPts[id]={f:0,a:0};
          sPts[id].f+=s1; sPts[id].a+=s2;
        });
        p2.forEach(id => {
          if (!sps[id]) sps[id]={name:'',w:0,l:0};
          p1w ? sps[id].l++ : sps[id].w++;
          if (!sPts[id]) sPts[id]={f:0,a:0};
          sPts[id].f+=s2; sPts[id].a+=s1;
        });
      });
    });
  });

  // Games list
  const sGames = [];
  (sess.boxes||[]).forEach((box,bi) => {
    const ps = box.players||[];
    (box.matches||[]).forEach(m => {
      const n1 = (m.pair1||[]).map(i=>(pn[(ps[i]||{}).id]||fn((ps[i]||{}).name))).join(' & ');
      const n2 = (m.pair2||[]).map(i=>(pn[(ps[i]||{}).id]||fn((ps[i]||{}).name))).join(' & ');
      (m.sets||[]).forEach(set => {
        const a=set[0],b=set[1];
        if(a===''||a==null||b===''||b==null)return;
        const [s1,s2]=[+a,+b];if(isNaN(s1)||isNaN(s2))return;
        const ws=Math.max(s1,s2),ls=Math.min(s1,s2);
        const wPair=s1>s2?n1:n2, lPair=s1>s2?n2:n1;
        sGames.push({wPair,lPair,ws,ls,score:`${ws}–${ls}`,margin:ws-ls,total:s1+s2,box:bi+1});
      });
    });
  });

  const ssets = allSets.filter(s => s.date===date);
  const nm = ids => ids.map(id=>pn[id]||'?').join(' & ');
  const cl = ssets.length ? [...ssets].sort((a,b)=>a.mg-b.mg)[0] : null;
  const bl = ssets.length ? [...ssets].sort((a,b)=>b.mg-a.mg)[0] : null;
  const hi = ssets.length ? [...ssets].sort((a,b)=>b.tp-a.tp)[0] : null;
  const att = (sess.attendees||sess.players||[]).length;
  const sessCal = ssets.length * 4 * CAL_PER_PLAYER_SET;
  const avgMg = ssets.length ? (ssets.reduce((s,x)=>s+x.mg,0)/ssets.length).toFixed(1) : '–';

  const pick = dates.map(d => `<button class="spick${d===date?' on':''}" onclick="renderSe('${d}')">${d.slice(5)}</button>`).join('');

  document.getElementById('se-ct').innerHTML = `
  <div class="sess-picker">${pick}</div>
  <div class="cards">
    <div class="card"><div class="card-lbl">Attendees</div><div class="card-val">${att}</div></div>
    <div class="card"><div class="card-lbl">Boxes</div><div class="card-val">${(sess.boxes||[]).length}</div></div>
    <div class="card"><div class="card-lbl">Sets</div><div class="card-val">${ssets.length}</div></div>
    <div class="card"><div class="card-lbl">Avg margin</div><div class="card-val">${avgMg}</div></div>
    <div class="card"><div class="card-lbl">Total points</div><div class="card-val">${ssets.reduce((s,x)=>s+x.tp,0)}</div></div>
    <div class="card" style="border-color:var(--acc);background:var(--adim)">
      <div class="card-lbl">Est. calories <span class="tip" title="~${CAL_PER_PLAYER_SET} cal/player/set">i</span></div>
      <div class="card-val" style="color:var(--acc)">${sessCal.toLocaleString()}</div>
    </div>
  </div>
  ${cl||bl||hi ? `<div class="recs">
    ${cl?`<div class="rec"><div class="rec-lbl">Closest set</div><div class="rec-score">${cl.s1}–${cl.s2}</div><div class="rec-detail">${nm(cl.p1)} vs ${nm(cl.p2)}</div></div>`:''}
    ${bl?`<div class="rec"><div class="rec-lbl">Biggest blowout</div><div class="rec-score">${bl.s1}–${bl.s2}</div><div class="rec-detail">${nm(bl.p1)} vs ${nm(bl.p2)}</div></div>`:''}
    ${hi?`<div class="rec"><div class="rec-lbl">Highest-scoring set</div><div class="rec-score">${hi.s1}–${hi.s2}</div><div class="rec-detail">${nm(hi.p1)} vs ${nm(hi.p2)}</div></div>`:''}
  </div>` : ''}
  <div class="cc">
    <div class="cc-ttl">Players</div>
    <div id="tbl-sp"></div>
  </div>
  <div class="cc">
    <div class="cc-ttl">Sets</div>
    <div id="tbl-sg"></div>
  </div>`;

  // Build player rows
  const plRows = Object.entries(sps).map(([id,s]) => {
    const p = sPts[+id]||{f:0,a:0};
    const tot=s.w+s.l;
    return {id:+id, name:pn[+id]||fn(s.name), w:s.w, l:s.l, tot, pct:tot?s.w/tot:0, pFor:p.f, pAg:p.a, diff:p.f-p.a};
  });
  const pct = r => Math.round(r.pct*100)+'%';
  const diff = r => (r.diff>=0?'+':'')+r.diff;

  setTbl('tbl-sp', plRows, [
    {label:'Player', val:r=>r.name, cls:()=>'nm', fmt:r=>r.name},
    {label:'Sets W', val:r=>r.w, cls:r=>r.w>r.l?'wn':''},
    {label:'Sets L', val:r=>r.l, cls:r=>r.l>r.w?'ls':''},
    {label:'Total', val:r=>r.tot},
    {label:'Win %', val:r=>r.pct, fmt:pct, cls:r=>r.pct>=.5?'wn':'ls'},
    {label:'Pts For', val:r=>r.pFor},
    {label:'Pts Ag', val:r=>r.pAg, cls:()=>'ls'},
    {label:'+/−', val:r=>r.diff, fmt:diff, cls:r=>r.diff>=0?'wn':'ls'},
  ], 4, -1);

  setTbl('tbl-sg', sGames, [
    {label:'Winner', val:r=>r.wPair, cls:()=>'nm wn', fmt:r=>r.wPair},
    {label:'Loser', val:r=>r.lPair, cls:()=>'ls', fmt:r=>r.lPair},
    {label:'Score', val:r=>r.ws, fmt:r=>r.score, cls:()=>'sc'},
    {label:'Margin', val:r=>r.margin},
    {label:'Total pts', val:r=>r.total},
    {label:'Box', val:r=>r.box},
  ], 3, -1);
}

    <div class="card"><div class="card-lbl">Win rate</div><div class="card-val">${pct}%</div></div>
    <div class="card"><div class="card-lbl">Pts For</div><div class="card-val">${ps.ptsFor}</div></div>
    <div class="card"><div class="card-lbl">Pts Against</div><div class="card-val">${ps.ptsAgainst}</div><div class="card-sub">${ps.ptsFor-ps.ptsAgainst>=0?'+':''}${ps.ptsFor-ps.ptsAgainst} diff</div></div>
  </div>
  <div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Attendance &amp; box</div>
  <div class="dots">${dots}</div>
  ${hasRank ? `<div class="cc"><div class="cc-ttl">Leaderboard rank over time (lower is better)</div><canvas class="ch" id="c-rk"></canvas></div>` : ''}
  ${hasBox ? `<div class="cc"><div class="cc-ttl">Box position over time</div><canvas class="ch-sm" id="c-bx"></canvas></div>` : ''}
  <div class="row2">
    <div class="cc"><div class="cc-ttl">Partners — set record</div><div id="tbl-prt"></div></div>
    <div class="cc"><div class="cc-ttl">Opponents — set record</div><div id="tbl-opp"></div></div>
  </div>`;
  document.getElementById('pdet').classList.add('on');

  setTbl('tbl-prt', parts, [
    {label:'Partner', val:r=>r.name, cls:()=>'nm', fmt:r=>r.name},
    {label:'W', val:r=>r.w, cls:r=>r.w>r.l?'wn':''},
    {label:'L', val:r=>r.l, cls:r=>r.l>r.w?'ls':''},
    {label:'Sets', val:r=>r.t},
    {label:'Win %', val:r=>r.pct, fmt:prow, cls:pcls},
  ], 4, -1);

  setTbl('tbl-opp', opps, [
    {label:'Opponent', val:r=>r.name, cls:()=>'nm', fmt:r=>r.name},
    {label:'W', val:r=>r.w, cls:r=>r.w>r.l?'wn':''},
    {label:'L', val:r=>r.l, cls:r=>r.l>r.w?'ls':''},
    {label:'Sets', val:r=>r.t},
    {label:'Win %', val:r=>r.pct, fmt:prow, cls:pcls},
  ], 4, -1);

  requestAnimationFrame(() => {
    const rkC = document.getElementById('c-rk');
    if (rkC) drawRankLine(rkC, id, rh, dates);
    const bxC = document.getElementById('c-bx');
    if (bxC) drawSpark(bxC, boxvals, dates);
  });
}

// ── PLAYER SEARCH ───────────────────────────────────────────────────
function setupSearch() {
  const inp = document.getElementById('pi'), dd = document.getElementById('pd');
  const {pst, pn, dates} = STATS;
  const all = Object.keys(pst).map(id => ({id:+id, name:pn[+id]||`#${id}`, n:pst[+id].sess.size}))
    .sort((a,b) => a.name.localeCompare(b.name));
  function show(f='') {
    const m = all.filter(p => p.name.toLowerCase().includes(f.toLowerCase())).slice(0,25);
    if (!m.length) { dd.style.display='none'; return; }
    dd.innerHTML = m.map(p => `<div class="popt" onclick="selPl(${p.id},'${p.name.replace(/'/g,"\\'")}')">${p.name} <span style="color:var(--t3);font-size:10px">${p.n}/${dates.length}×</span></div>`).join('');
    dd.style.display = 'block';
  }
  inp.addEventListener('focus', () => show(inp.value));
  inp.addEventListener('input', () => show(inp.value));
  document.addEventListener('click', e => { if (!e.target.closest('.psearch-wrap')) dd.style.display='none'; });
}
function selPl(id, name) {
  document.getElementById('pi').value = name;
  document.getElementById('pd').style.display = 'none';
  renderPl(id);
}

// ── TABS + THEME ─────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('s-'+btn.dataset.tab).classList.add('on');
    if (btn.dataset.tab==='se' && STATS) renderSe(STATS.dates[STATS.dates.length-1]);
  });
});
function toggleTheme() {
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme', cur==='dark'?'light':'dark');
  if (STATS) {
    const at = document.querySelector('.tab.on')?.dataset?.tab;
    if (at==='ov') renderOv();
    else if (at==='se') renderSe(_curSessDate||STATS.dates[STATS.dates.length-1]);
  }
}

loadData();
</script>
