<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Northland Badminton — Analytics v2</title>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6/dist/plot.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.default.min.css">
<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.production.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css">
<style>
:root{
  --bg:#0F1923;--sur:#162030;--card:#1A2B3C;--hi:#1E3248;
  --bdr:rgba(255,255,255,0.07);
  --acc:#F0C040;--adim:rgba(240,192,64,0.13);
  --win:#22D3A0;--loss:#F87171;
  --t1:#EDF2F7;--t2:#7A9AB5;--t3:#3D5568;
  --r:5px;
  --font:-apple-system,'Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono','Cascadia Code','Fira Mono',ui-monospace,monospace;
}
@media(prefers-color-scheme:light){:root{
  --bg:#F0F4F8;--sur:#fff;--card:#fff;--hi:#EEF3F8;
  --bdr:rgba(0,0,0,0.08);--acc:#B07800;--adim:rgba(176,120,0,0.1);
  --win:#047857;--loss:#B91C1C;--t1:#0F1923;--t2:#4A6278;--t3:#94A3B8;
}}
:root[data-theme=light]{--bg:#F0F4F8;--sur:#fff;--card:#fff;--hi:#EEF3F8;--bdr:rgba(0,0,0,0.08);--acc:#B07800;--adim:rgba(176,120,0,0.1);--win:#047857;--loss:#B91C1C;--t1:#0F1923;--t2:#4A6278;--t3:#94A3B8;}
:root[data-theme=dark]{--bg:#0F1923;--sur:#162030;--card:#1A2B3C;--hi:#1E3248;--bdr:rgba(255,255,255,0.07);--acc:#F0C040;--adim:rgba(240,192,64,0.13);--win:#22D3A0;--loss:#F87171;--t1:#EDF2F7;--t2:#7A9AB5;--t3:#3D5568;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.5;min-height:100vh}
.hdr{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex;align-items:center;height:50px;gap:14px;position:sticky;top:0;z-index:100}
.hdr-logo{font-size:15px;font-weight:700;letter-spacing:-.02em}
.hdr-logo em{color:var(--acc);font-style:normal}
.v-badge{font-size:10px;background:var(--adim);color:var(--acc);border:1px solid var(--acc);border-radius:3px;padding:1px 5px;font-weight:600}
.hdr-sp{flex:1}
.theme-btn{background:none;border:1px solid var(--bdr);color:var(--t2);cursor:pointer;border-radius:var(--r);padding:4px 10px;font-size:12px;font-family:var(--font)}
.tabs{background:var(--sur);border-bottom:1px solid var(--bdr);padding:0 20px;display:flex}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:var(--font);transition:color .15s,border-color .15s}
.tab:hover{color:var(--t1)}
.tab.on{color:var(--acc);border-bottom-color:var(--acc)}
.sec{max-width:1100px;margin:0 auto;padding:20px;display:none}
.sec.on{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px}
.card-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:4px;display:flex;align-items:center;gap:4px}
.card-val{font-size:26px;font-weight:700;letter-spacing:-.02em;font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1.1}
.card-sub{font-size:11px;color:var(--t3);margin-top:2px}
.tip{cursor:help;color:var(--t3);font-size:10px;border:1px solid var(--bdr);border-radius:50%;width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:680px){.row2{grid-template-columns:1fr}}
.cc{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.cc-ttl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.row2 .cc{margin-bottom:0}
.chart-wrap{width:100%;overflow-x:auto}
.chart-wrap svg{display:block;width:100%;height:auto}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:10px;margin-bottom:14px}
.rec{background:var(--card);border:1px solid var(--bdr);border-radius:var(--r);padding:12px 14px}
.rec-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.rec-score{font-size:19px;font-weight:700;font-family:var(--mono);color:var(--acc);margin-bottom:2px}
.rec-detail{font-size:11px;color:var(--t2)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filter-lbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);white-space:nowrap}
.fbtn{padding:3px 9px;font-size:11px;border:1px solid var(--bdr);background:var(--card);color:var(--t3);border-radius:var(--r);cursor:pointer;font-family:var(--font);transition:all .1s}
.fbtn:hover{color:var(--t2);border-color:var(--t2)}
.fbtn.on{background:var(--adim);color:var(--acc);border-color:var(--acc)}
.sep{width:1px;height:16px;background:var(--bdr);flex-shrink:0}
.bump-ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.qs-btn{padding:3px 10px;font-size:11px;font-weight:500;border:1px solid var(--bdr);background:var(--card);color:var(--t2);border-radius:var(--r);cursor:pointer;font-family:var(--font)}
.qs-btn:hover{color:var(--t1);border-color:var(--t2)}
.bump-chips{display:flex;flex-wrap:wrap;gap:5px;max-height:88px;overflow-y:auto;margin-bottom:10px}
.chip{padding:2px 8px;font-size:11px;border:1px solid var(--bdr);background:var(--card);color:var(--t3);border-radius:20px;cursor:pointer;font-family:var(--font);transition:all .1s}
.chip.on{background:var(--adim);color:var(--acc);border-color:var(--acc)}
.sess-picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.spick{padding:5px 13px;font-size:12px;font-weight:500;border:1px solid var(--bdr);background:var(--card);color:var(--t2);border-radius:var(--r);cursor:pointer;font-family:var(--font);transition:all .12s}
.spick.on{background:var(--adim);color:var(--acc);border-color:var(--acc)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);text-align:left;padding:6px 9px;border-bottom:1px solid var(--bdr);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--t2)}
.tbl th.asc::after{content:' ↑';opacity:.9}
.tbl th.desc::after{content:' ↓';opacity:.9}
.tbl th:not(.asc):not(.desc)::after{content:' ↕';opacity:.3}
.tbl td{padding:7px 9px;color:var(--t2);border-bottom:1px solid var(--bdr);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--hi)}
.tbl td.nm{color:var(--t1);font-weight:500;white-space:normal}
.tbl td.wn{color:var(--win);font-weight:600}
.tbl td.ls{color:var(--loss)}
.tbl td.sc{color:var(--acc);font-family:var(--mono)}
.tbl-filter{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tbl-search{background:var(--hi);border:1px solid var(--bdr);color:var(--t1);font-family:var(--font);font-size:12px;padding:5px 10px;border-radius:var(--r);outline:none;width:200px}
.tbl-search:focus{border-color:var(--acc)}
.tbl-search::placeholder{color:var(--t3)}
.mode-toggle{display:flex;gap:0;margin-bottom:18px;border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden;width:fit-content}
.mode-btn{padding:7px 18px;font-size:12px;font-weight:500;border:none;background:none;color:var(--t2);cursor:pointer;font-family:var(--font);transition:all .15s}
.mode-btn.on{background:var(--adim);color:var(--acc)}
.psearch-wrap{position:relative;margin-bottom:16px;max-width:320px}
.psearch{width:100%;background:var(--card);border:1px solid var(--bdr);color:var(--t1);font-family:var(--font);font-size:14px;padding:8px 12px;border-radius:var(--r);outline:none}
.psearch:focus{border-color:var(--acc)}
.psearch::placeholder{color:var(--t3)}
.pdrop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:200px;overflow-y:auto;z-index:10;display:none}
.popt{padding:7px 12px;cursor:pointer;font-size:13px;color:var(--t2)}
.popt:hover{background:var(--hi);color:var(--t1)}
.pdet{display:none}
.pdet.on{display:block}
.pname{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono)}
.dot.y{background:var(--adim);color:var(--acc);border:1.5px solid var(--acc)}
.dot.n{background:transparent;border:1.5px solid var(--bdr);color:var(--t3)}
.cmp-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cmp-wrap{position:relative;max-width:320px;margin-bottom:12px}
.cmp-input{width:100%;background:var(--card);border:1px solid var(--bdr);color:var(--t1);font-family:var(--font);font-size:13px;padding:7px 12px;border-radius:var(--r);outline:none}
.cmp-input:focus{border-color:var(--acc)}
.cmp-drop{position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--r) var(--r);max-height:180px;overflow-y:auto;z-index:10;display:none}
.cmp-opt{padding:7px 12px;cursor:pointer;font-size:12px;color:var(--t2)}
.cmp-opt:hover{background:var(--hi);color:var(--t1)}
.h2h-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.h2h-mode{display:flex;gap:0;border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}
.h2h-mode button{padding:6px 14px;font-size:12px;font-weight:500;border:none;background:none;color:var(--t2);cursor:pointer;font-family:var(--font)}
.h2h-mode button.on{background:var(--adim);color:var(--acc)}
.slider-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.slider-wrap input[type=range]{accent-color:var(--acc);cursor:pointer}
.h2h-detail{background:var(--card);border:1px solid var(--acc);border-radius:var(--r);padding:14px 16px;margin-top:14px;display:none}
.h2h-detail.on{display:block}
/* ── Grid.js theme ── */
.gridjs-wrapper{border:1px solid var(--bdr)!important;border-radius:var(--r)!important;overflow-x:auto!important;overflow-y:hidden!important}
td.gridjs-td:first-child{position:sticky!important;left:0!important;z-index:1!important;background:var(--card)!important}
tr.gridjs-tr:hover td.gridjs-td:first-child{background:var(--hi)!important}
.gridjs-thead tr:first-child th:first-child{position:sticky!important;left:0!important;z-index:3!important;background:var(--card)!important}
.gridjs-table{background:var(--card)!important;width:auto!important;min-width:100%!important}
th.gridjs-th{background:var(--card)!important;color:var(--t3)!important;font-size:10px!important;font-weight:700!important;text-transform:uppercase!important;letter-spacing:.07em!important;border-bottom:1px solid var(--bdr)!important;padding:8px 11px!important;white-space:nowrap!important;border-top:none!important;border-left:none!important;border-right:none!important}
th.gridjs-th[colspan]{color:var(--t2)!important;text-align:center!important;font-size:9px!important;letter-spacing:.1em!important;border-bottom:1px solid var(--bdr)!important;padding:5px 11px!important}
th.gridjs-th:hover{background:var(--hi)!important}
td.gridjs-td{color:var(--t2)!important;padding:8px 11px!important;border-bottom:1px solid var(--bdr)!important;border-left:none!important;border-right:none!important;font-variant-numeric:tabular-nums!important;font-size:13px!important;white-space:nowrap!important;min-width:44px!important}
tr.gridjs-tr:last-child td.gridjs-td{border-bottom:none!important}
tr.gridjs-tr:hover td.gridjs-td{background:var(--hi)!important}
.gridjs-sort{opacity:.25;margin-left:4px;font-size:10px}
.gridjs-th-sort-asc .gridjs-sort,.gridjs-th-sort-desc .gridjs-sort{opacity:1;color:var(--acc)!important}
.gridjs-head,.gridjs-footer{background:var(--card)!important;border:none!important}
.gridjs-container{color:var(--t1)!important}
.nm-cell{color:var(--t1)!important;font-weight:500!important}
.wn-cell{color:var(--win)!important;font-weight:600!important}
.ls-cell{color:var(--loss)!important}
.sc-cell{color:var(--acc)!important;font-family:var(--mono)!important}
.dim-cell{color:var(--t3)!important}
/* ── Tom Select theme ── */
.ts-wrapper.multi .ts-control{background:var(--card)!important;border:1px solid var(--bdr)!important;border-radius:var(--r)!important;color:var(--t1)!important;font-family:var(--font)!important;font-size:13px!important;padding:4px 8px!important;min-height:36px!important;box-shadow:none!important}
.ts-wrapper.multi .ts-control:focus-within,.ts-wrapper.multi.focus .ts-control{border-color:var(--acc)!important;box-shadow:none!important}
.ts-dropdown{background:var(--card)!important;border:1px solid var(--bdr)!important;border-top:none!important;border-radius:0 0 var(--r) var(--r)!important;color:var(--t1)!important;font-family:var(--font)!important;font-size:13px!important;z-index:200!important}
.ts-dropdown .option{padding:7px 12px!important;color:var(--t2)!important}
.ts-dropdown .option:hover,.ts-dropdown .option.active{background:var(--hi)!important;color:var(--t1)!important}
.ts-dropdown .option.selected{background:var(--adim)!important;color:var(--acc)!important}
.ts-wrapper .ts-control .item{background:color-mix(in srgb,var(--acc) 18%,transparent)!important;color:var(--acc)!important;border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)!important;border-radius:20px!important;padding:3px 6px 3px 10px!important;font-size:12px!important;font-weight:600!important;display:inline-flex!important;align-items:center!important;gap:2px!important}
.ts-wrapper .ts-control .item .remove{color:var(--acc)!important;opacity:.6!important;margin-left:2px!important;padding:0 2px!important;font-size:14px!important;line-height:1!important;cursor:pointer!important}
.ts-wrapper .ts-control .item .remove:hover{opacity:1!important;color:var(--loss)!important}
.ts-control input{color:var(--t1)!important;font-family:var(--font)!important}
.ts-control input::placeholder{color:var(--t3)!important}
.ts-filter-row{display:flex;gap:8px;align-items:flex-start}
.ts-filter-sel{flex:1;min-width:0}
.ts-action-btns{display:flex;flex-direction:column;gap:4px;flex-shrink:0}
.ts-action-btn{font-size:11px;font-weight:600;padding:4px 10px;background:var(--hi);border:1px solid var(--bdr);color:var(--t2);border-radius:var(--r);cursor:pointer;font-family:var(--font);white-space:nowrap;min-width:42px;text-align:center}
.ts-action-btn:hover{color:var(--t1);border-color:var(--t2)}
</style>
</head>
<body>
<header class="hdr">
  <div class="hdr-logo">NB<em>·</em>Analytics</div>
  <span class="v-badge">v2 · Plot</span>
  <div class="hdr-sp"></div>
  <button class="theme-btn" onclick="toggleTheme()">Toggle theme</button>
</header>
<nav class="tabs">
  <button class="tab on" data-tab="ov">Overview</button>
  <button class="tab" data-tab="se">Sessions</button>
  <button class="tab" data-tab="pl">Players</button>
  <button class="tab" data-tab="h2">H2H</button>
</nav>

<section id="s-ov" class="sec on"><div id="ov-ct"></div></section>
<section id="s-se" class="sec">
  <div id="sess-picker-wrap" class="sess-picker" style="margin-bottom:18px"></div>
  <div id="se-cards"></div>
  <div id="se-recs"></div>
  <div class="cc" id="sess-filter-card" style="margin-bottom:14px">
    <div class="ts-filter-row">
      <div class="ts-filter-sel"><select id="player-filter-sel" multiple></select></div>
      <div class="ts-action-btns">
        <button class="ts-action-btn" onclick="filterSelAll('players')">All</button>
        <button class="ts-action-btn" onclick="filterSelNone('players')">None</button>
      </div>
    </div>
    <div class="ts-filter-row" style="margin-top:10px">
      <div class="ts-filter-sel"><select id="box-filter-sel" multiple></select></div>
      <div class="ts-action-btns">
        <button class="ts-action-btn" onclick="filterSelAll('box')">All</button>
        <button class="ts-action-btn" onclick="filterSelNone('box')">None</button>
      </div>
    </div>
  </div>
  <div class="cc" style="margin-bottom:14px">
    <div class="cc-ttl">Players</div>
    <div id="gj-players"></div>
  </div>
  <div class="cc">
    <div class="cc-ttl">Sets</div>
    <div id="gj-sets"></div>
  </div>
</section>
<section id="s-pl" class="sec">
  <div class="mode-toggle">
    <button class="mode-btn on" onclick="setPlMode('single')">Single player</button>
    <button class="mode-btn" onclick="setPlMode('compare')">Compare</button>
  </div>
  <div id="pl-single">
    <div class="psearch-wrap">
      <input type="text" class="psearch" id="pi" placeholder="Search player…" autocomplete="off">
      <div class="pdrop" id="pd"></div>
    </div>
    <div class="pdet" id="pdet"></div>
  </div>
  <div id="pl-compare" style="display:none">
    <div class="cmp-wrap">
      <input type="text" class="cmp-input" id="ci" placeholder="Add player to compare (up to 4)…" autocomplete="off">
      <div class="cmp-drop" id="cd"></div>
    </div>
    <div class="cmp-chips" id="cmp-chips"></div>
    <div id="cmp-ct"></div>
  </div>
</section>
<section id="s-h2" class="sec">
  <div class="h2h-ctrl">
    <div class="h2h-mode">
      <button class="on" onclick="h2hSetMode('partners',this)">As partners</button>
      <button onclick="h2hSetMode('opponents',this)">As opponents</button>
    </div>
    <div class="slider-wrap">
      Min games: <input type="range" id="h2h-min" min="1" max="10" value="3" oninput="h2hSetMin(+this.value)">
      <span id="h2h-min-lbl">3</span>
    </div>
    <div style="flex:1"></div>
    <input type="text" class="tbl-search" id="h2h-search" placeholder="Filter player…" oninput="renderH2H()" style="width:180px">
  </div>
  <div class="cc"><div class="cc-ttl" id="h2h-ttl">Partner win % heatmap</div><div id="h2h-chart" class="chart-wrap"></div></div>
  <div class="h2h-detail" id="h2h-detail"></div>
</section>

<script>
// ── DATA ───────────────────────────────────────────────────────────
let _D = null, STATS = null;

async function loadData() {
  try {
    const [sR, lR] = await Promise.all([
      fetch('https://club.northlandbadminton.co.nz/api/sessions'),
      fetch('https://club.northlandbadminton.co.nz/api/leaderboard')
    ]);
    const sessions = await sR.json();
    const leaderboard = await lR.json();
    _D = { sessions: Array.isArray(sessions) ? sessions : (sessions.sessions || []), leaderboard };
  } catch(e) {
    document.getElementById('ov-ct').innerHTML = '<p style="color:var(--loss);padding:40px">Failed to load: ' + e.message + '</p>';
    return;
  }
  STATS = buildStats(_D);
  renderOv();
  setupSearch();
  setupCmpSearch();
  renderH2H();
}

// ── PROCESSING ─────────────────────────────────────────────────────
function fn(n) { return n ? n.split(' ')[0] : '?'; }

function buildStats(raw) {
  const { sessions, leaderboard } = raw;
  const pn = {};
  if (leaderboard && leaderboard.players)
    leaderboard.players.forEach(function(p) { pn[p.id] = p.preferred_name || fn(p.name); });
  const dates = sessions.map(function(s) { return s.date; }).sort();
  const allSets = [], pst = {}, parst = {}, vsst = {}, rh = {};
  function ep(id, name) {
    if (!pst[id]) pst[id] = { w:0, l:0, ptsFor:0, ptsAgainst:0, sess:new Set(), box:{} };
    if (name && !pn[id]) pn[id] = fn(name);
  }
  sessions.forEach(function(s) {
    const date = s.date, boxes = s.boxes || [];
    boxes.forEach(function(box, bi) {
      const bx = bi+1, ps = box.players || [];
      ps.forEach(function(p) { ep(p.id, p.name); pst[p.id].sess.add(date); pst[p.id].box[date] = bx; });
      (box.matches || []).forEach(function(m) {
        const p1 = (m.pair1||[]).map(function(i) { return ps[i] && ps[i].id; }).filter(Boolean);
        const p2 = (m.pair2||[]).map(function(i) { return ps[i] && ps[i].id; }).filter(Boolean);
        const k1 = p1.slice().sort(function(a,b){return a-b;}).join(',');
        const k2 = p2.slice().sort(function(a,b){return a-b;}).join(',');
        (m.sets || []).forEach(function(set) {
          const a = set[0], b = set[1];
          if (a===''||a==null||b===''||b==null) return;
          const s1 = +a, s2 = +b; if (isNaN(s1)||isNaN(s2)) return;
          const p1w = s1>s2, mg = Math.abs(s1-s2);
          allSets.push({ date:date, bx:bx, p1:p1, p2:p2, s1:s1, s2:s2, mg:mg, tp:s1+s2 });
          p1.forEach(function(id) { ep(id,null); p1w?pst[id].w++:pst[id].l++; pst[id].ptsFor+=s1; pst[id].ptsAgainst+=s2; });
          p2.forEach(function(id) { ep(id,null); p1w?pst[id].l++:pst[id].w++; pst[id].ptsFor+=s2; pst[id].ptsAgainst+=s1; });
          [{k:k1,ids:p1,won:p1w},{k:k2,ids:p2,won:!p1w}].forEach(function(x) {
            if (!x.k||!x.ids.length) return;
            if (!parst[x.k]) parst[x.k]={ids:x.ids,w:0,l:0};
            x.won?parst[x.k].w++:parst[x.k].l++;
          });
          p1.forEach(function(aid) { p2.forEach(function(bid) {
            const ka = aid+'_'+bid, kb = bid+'_'+aid;
            if (!vsst[ka]) vsst[ka]={w:0,l:0};
            if (!vsst[kb]) vsst[kb]={w:0,l:0};
            if (p1w){vsst[ka].w++;vsst[kb].l++;}else{vsst[ka].l++;vsst[kb].w++;}
          }); });
        });
      });
    });
    if (s.leaderboardAfter) s.leaderboardAfter.forEach(function(p,i){if(!rh[p.id])rh[p.id]={};rh[p.id][date]=i+1;});
    else if (s.leaderboardBefore) s.leaderboardBefore.forEach(function(p,i){if(!rh[p.id])rh[p.id]={};rh[p.id][date]=i+1;});
  });
  const totPts = allSets.reduce(function(s,x){return s+x.tp;},0);
  const CAL = 45, totCal = allSets.length*4*CAL;
  return { sessions:sessions, dates:dates, pn:pn, pst:pst, parst:parst, vsst:vsst, rh:rh, allSets:allSets, totPts:totPts, totCal:totCal, CAL:CAL };
}

// ── SORTABLE TABLE ──────────────────────────────────────────────────
const _sorts={}, _tblData={}, _tblCols={};
function renderTbl(id, filterFn) {
  const rows = (_tblData[id]||[]).filter(filterFn || function(){ return true; });
  const cols = _tblCols[id]||[];
  const sort = _sorts[id]||{col:0,dir:-1};
  const col = cols[sort.col];
  if (!col) return;
  const sorted = rows.slice().sort(function(a,b) {
    const va=col.val(a), vb=col.val(b);
    return sort.dir*(typeof va==='string'?va.localeCompare(vb):vb-va);
  });
  const ths = cols.map(function(c,i) {
    const cls = i===sort.col?(sort.dir>0?'asc':'desc'):'';
    return '<th class="'+cls+'" onclick="tblSort(\''+id+'\','+i+')">'+c.label+'</th>';
  }).join('');
  const trs = sorted.map(function(r) {
    return '<tr>'+cols.map(function(c) {
      return '<td class="'+(c.cls?c.cls(r):'')+'">'+(c.fmt?c.fmt(r):c.val(r))+'</td>';
    }).join('')+'</tr>';
  }).join('');
  const el = document.getElementById(id);
  if (el) el.innerHTML='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+ths+'</tr></thead><tbody>'+
    (trs||'<tr><td colspan="'+cols.length+'" style="color:var(--t3);padding:12px">No data</td></tr>')+
    '</tbody></table></div>';
}
function tblSort(id, ci) {
  const cur = _sorts[id]||{col:-1,dir:-1};
  _sorts[id] = {col:ci, dir:cur.col===ci?-cur.dir:-1};
  const el = document.getElementById(id);
  const q = el&&el.closest('.cc')&&el.closest('.cc').querySelector('.tbl-search');
  const f = q?q.value:'';
  renderTbl(id, function(r){ return !f||colsMatch(r,f); });
}
function colsMatch(r,f){ return Object.values(r).some(function(v){return String(v).toLowerCase().includes(f.toLowerCase());}); }
function setTbl(id,data,cols,defCol,defDir){
  defCol=defCol||0; defDir=defDir||-1;
  _tblData[id]=data; _tblCols[id]=cols; _sorts[id]={col:defCol,dir:defDir};
  renderTbl(id);
}
function filterTbl(id,f){ renderTbl(id, function(r){return !f||String(r.name||'').toLowerCase().includes(f.toLowerCase());}); }

var _curDate = null, _sessPlayers = [], _sessSets = [];
var _fPlayers = new Set(), _fBoxes = new Set();
var _tsInst = null, _tsBox = null, _gjPlayers = null, _gjSets = null;

function renderSe(selDate) {
  const {sessions,dates,pn,allSets,CAL} = STATS;
  const sess = sessions.find(function(s){return s.date===selDate;})||sessions[sessions.length-1];
  _curDate = sess.date;
  const date = sess.date;

  document.getElementById('sess-picker-wrap').innerHTML =
    dates.map(function(d){return '<button class="spick'+(d===date?' on':'')+'" onclick="renderSe(\''+d+'\')">'+d.slice(5)+'</button>';}).join('');

  const sps={}, sPts={}, playerBoxMap={}, spm={};
  (sess.boxes||[]).forEach(function(box,bi){
    const bx=bi+1, ps=box.players||[];
    ps.forEach(function(p){if(!sps[p.id])sps[p.id]={name:p.name,w:0,l:0};playerBoxMap[p.id]=bx;});
    (box.matches||[]).forEach(function(m){
      const p1=(m.pair1||[]).map(function(i){return ps[i]&&ps[i].id;}).filter(Boolean);
      const p2=(m.pair2||[]).map(function(i){return ps[i]&&ps[i].id;}).filter(Boolean);
      var p1sw=0, p2sw=0;
      (m.sets||[]).forEach(function(set){
        const a=set[0],b=set[1];
        if(a===''||a==null||b===''||b==null)return;
        const s1=+a,s2=+b; if(isNaN(s1)||isNaN(s2))return;
        const p1w=s1>s2;
        if(p1w)p1sw++;else p2sw++;
        p1.forEach(function(id){if(!sps[id])sps[id]={name:'',w:0,l:0};p1w?sps[id].w++:sps[id].l++;if(!sPts[id])sPts[id]={f:0,a:0};sPts[id].f+=s1;sPts[id].a+=s2;});
        p2.forEach(function(id){if(!sps[id])sps[id]={name:'',w:0,l:0};p1w?sps[id].l++:sps[id].w++;if(!sPts[id])sPts[id]={f:0,a:0};sPts[id].f+=s2;sPts[id].a+=s1;});
      });
      // Match win = majority of sets (ties not counted)
      if(p1.length&&p2.length&&p1sw!==p2sw){
        var p1mw=p1sw>p2sw;
        p1.concat(p2).forEach(function(id){if(!spm[id])spm[id]={w:0,l:0};});
        p1.forEach(function(id){p1mw?spm[id].w++:spm[id].l++;});
        p2.forEach(function(id){p1mw?spm[id].l++:spm[id].w++;});
      }
    });
  });

  const sGames=[];
  (sess.boxes||[]).forEach(function(box,bi){
    const bx=bi+1, ps=box.players||[];
    (box.matches||[]).forEach(function(m){
      const n1=(m.pair1||[]).map(function(i){return pn[(ps[i]||{}).id]||fn((ps[i]||{name:''}).name);}).join(' & ');
      const n2=(m.pair2||[]).map(function(i){return pn[(ps[i]||{}).id]||fn((ps[i]||{name:''}).name);}).join(' & ');
      const ids1=(m.pair1||[]).map(function(i){return ps[i]&&ps[i].id;}).filter(Boolean);
      const ids2=(m.pair2||[]).map(function(i){return ps[i]&&ps[i].id;}).filter(Boolean);
      (m.sets||[]).forEach(function(set){
        const a=set[0],b=set[1];if(a===''||a==null||b===''||b==null)return;
        const s1=+a,s2=+b;if(isNaN(s1)||isNaN(s2))return;
        const ws=Math.max(s1,s2),ls=Math.min(s1,s2),p1w=s1>s2;
        sGames.push({wPair:p1w?n1:n2,lPair:p1w?n2:n1,wIds:p1w?ids1:ids2,lIds:p1w?ids2:ids1,
          ws:ws,ls:ls,score:ws+'–'+ls,margin:ws-ls,total:s1+s2,box:bx});
      });
    });
  });

  _sessPlayers=Object.keys(sps).map(function(id){
    const s=sps[id],p=sPts[+id]||{f:0,a:0},tot=s.w+s.l;
    const m=spm[+id]||{w:0,l:0},mt=m.w+m.l;
    return {id:+id,name:pn[+id]||fn(s.name),
      mt:mt,mw:m.w,ml:m.l,mpct:mt?m.w/mt:0,
      tot:tot,w:s.w,l:s.l,pct:tot?s.w/tot:0,
      pFor:p.f,pAg:p.a,diff:p.f-p.a,box:playerBoxMap[+id]||1};
  });
  _sessSets=sGames;

  const ssets=allSets.filter(function(s){return s.date===date;});
  const att=(sess.attendees||sess.players||[]).length||_sessPlayers.length;
  const sessCal=ssets.length*4*CAL;
  const avgMg=ssets.length?(ssets.reduce(function(s,x){return s+x.mg;},0)/ssets.length).toFixed(1):'–';
  document.getElementById('se-cards').innerHTML='<div class="cards">'+
    '<div class="card"><div class="card-lbl">Attendees</div><div class="card-val">'+att+'</div></div>'+
    '<div class="card"><div class="card-lbl">Boxes</div><div class="card-val">'+(sess.boxes||[]).length+'</div></div>'+
    '<div class="card"><div class="card-lbl">Sets</div><div class="card-val">'+ssets.length+'</div></div>'+
    '<div class="card"><div class="card-lbl">Avg margin</div><div class="card-val">'+avgMg+'</div></div>'+
    '<div class="card"><div class="card-lbl">Total points</div><div class="card-val">'+ssets.reduce(function(s,x){return s+x.tp;},0)+'</div></div>'+
    '<div class="card" style="border-color:var(--acc);background:var(--adim)">'+
      '<div class="card-lbl">Est. calories <span class="tip" title="~'+CAL+' cal/player/set">i</span></div>'+
      '<div class="card-val" style="color:var(--acc)">'+sessCal.toLocaleString()+'</div>'+
    '</div></div>';

  function nm(ids){return ids.map(function(id){return pn[id]||'?';}).join(' & ');}
  const cl=ssets.length?ssets.slice().sort(function(a,b){return a.mg-b.mg;})[0]:null;
  const bl=ssets.length?ssets.slice().sort(function(a,b){return b.mg-a.mg;})[0]:null;
  const hi=ssets.length?ssets.slice().sort(function(a,b){return b.tp-a.tp;})[0]:null;
  var recHtml='';
  if(cl||bl||hi){
    recHtml='<div class="recs">';
    if(cl)recHtml+='<div class="rec"><div class="rec-lbl">Closest set</div><div class="rec-score">'+cl.s1+'–'+cl.s2+'</div><div class="rec-detail">'+nm(cl.p1)+' vs '+nm(cl.p2)+'</div></div>';
    if(bl)recHtml+='<div class="rec"><div class="rec-lbl">Biggest blowout</div><div class="rec-score">'+bl.s1+'–'+bl.s2+'</div><div class="rec-detail">'+nm(bl.p1)+' vs '+nm(bl.p2)+'</div></div>';
    if(hi)recHtml+='<div class="rec"><div class="rec-lbl">Highest-scoring</div><div class="rec-score">'+hi.s1+'–'+hi.s2+'</div><div class="rec-detail">'+nm(hi.p1)+' vs '+nm(hi.p2)+'</div></div>';
    recHtml+='</div>';
  }
  document.getElementById('se-recs').innerHTML=recHtml;

  const boxes=[...new Set(_sessPlayers.map(function(p){return p.box;}))].sort();
  _fBoxes=new Set(boxes);
  _fPlayers=new Set();
  initSessFilter(_sessPlayers, boxes);
  initGrids();
  applyFilter();
}

function initSessFilter(players, boxes) {
  // Players
  const sel=document.getElementById('player-filter-sel');
  if (_tsInst) { _tsInst.destroy(); _tsInst=null; }
  sel.innerHTML=players.map(function(p){return '<option value="'+p.id+'">'+p.name+'</option>';}).join('');
  _tsInst=new TomSelect('#player-filter-sel',{
    plugins:['remove_button'],
    placeholder:'Players…',
    maxOptions:null,
    onChange:function(vals){ _fPlayers=new Set(vals.map(Number)); applyFilter(); }
  });
  players.forEach(function(p){_tsInst.addItem(String(p.id),true);});
  _fPlayers=new Set(players.map(function(p){return p.id;}));

  // Boxes
  const bsel=document.getElementById('box-filter-sel');
  if (_tsBox) { _tsBox.destroy(); _tsBox=null; }
  bsel.innerHTML=boxes.map(function(b){return '<option value="'+b+'">Box '+b+'</option>';}).join('');
  _tsBox=new TomSelect('#box-filter-sel',{
    plugins:['remove_button'],
    placeholder:'Boxes…',
    maxOptions:null,
    onChange:function(vals){ _fBoxes=new Set(vals.map(Number)); applyFilter(); }
  });
  boxes.forEach(function(b){_tsBox.addItem(String(b),true);});
  _fBoxes=new Set(boxes);
}

function filterSelAll(which) {
  if (which==='players' && _tsInst) {
    _sessPlayers.forEach(function(p){_tsInst.addItem(String(p.id),true);});
    _fPlayers=new Set(_sessPlayers.map(function(p){return p.id;}));
  } else if (which==='box' && _tsBox) {
    var allBoxes=[...new Set(_sessPlayers.map(function(p){return p.box;}))].sort();
    allBoxes.forEach(function(b){_tsBox.addItem(String(b),true);});
    _fBoxes=new Set(allBoxes);
  }
  applyFilter();
}

function filterSelNone(which) {
  if (which==='players' && _tsInst) {
    _tsInst.clear(true);
    _fPlayers=new Set();
  } else if (which==='box' && _tsBox) {
    _tsBox.clear(true);
    _fBoxes=new Set();
  }
  applyFilter();
}

function applyFilter() {
  const fp=_sessPlayers.filter(function(p){return _fBoxes.has(p.box)&&_fPlayers.has(p.id);});
  const fs=_sessSets.filter(function(s){
    return _fBoxes.has(s.box)&&s.wIds.concat(s.lIds).some(function(id){return _fPlayers.has(id);});
  });
  refreshPlayerGrid(fp);
  refreshSetsGrid(fs);
}

function initGrids() {
  const gjStyle={table:{'background':'transparent'},container:{'font-family':'var(--font)'}};
  if (_gjPlayers) { _gjPlayers.destroy(); }
  _gjPlayers=new gridjs.Grid({
    columns:[
      {name:'Player',sort:true,formatter:function(c){return gridjs.html('<span class="nm-cell">'+c+'</span>');}},
      {name:'Matches',columns:[

        {name:'W',sort:true,formatter:function(c){return c>0?gridjs.html('<span class="wn-cell">'+c+'</span>'):c;}},
        {name:'L',sort:true,formatter:function(c){return c>0?gridjs.html('<span class="ls-cell">'+c+'</span>'):c;}},
        {name:'%',sort:true,formatter:function(c,r){var mt=r.cells[1].data;return mt?gridjs.html('<span class="'+(c>=0.5?'wn-cell':'ls-cell')+'">'+Math.round(c*100)+'%</span>'):'–';}},
      ]},
      {name:'Sets',columns:[
        {name:'T',sort:true},
        {name:'W',sort:true,formatter:function(c){return c>0?gridjs.html('<span class="wn-cell">'+c+'</span>'):c;}},
        {name:'L',sort:true,formatter:function(c){return c>0?gridjs.html('<span class="ls-cell">'+c+'</span>'):c;}},
        {name:'%',sort:true,formatter:function(c,r){var tot=r.cells[5].data;return tot?gridjs.html('<span class="'+(c>=0.5?'wn-cell':'ls-cell')+'">'+Math.round(c*100)+'%</span>'):'–';}},
      ]},
      {name:'Points',columns:[
        {name:'F',sort:true},
        {name:'A',sort:true,formatter:function(c){return gridjs.html('<span class="ls-cell">'+c+'</span>');}},
        {name:'+/−',sort:true,formatter:function(c){return gridjs.html('<span class="'+(c>=0?'wn-cell':'ls-cell')+'">'+(c>=0?'+':'')+c+'</span>');}},
      ]},
    ],
    data:[],sort:{multiColumn:false},style:gjStyle
  }).render(document.getElementById('gj-players'));

  if (_gjSets) { _gjSets.destroy(); }
  _gjSets=new gridjs.Grid({
    columns:[
      {id:'wPair',name:'Winner',sort:true,formatter:function(c){return gridjs.html('<span class="nm-cell wn-cell">'+c+'</span>');}},
      {id:'lPair',name:'Loser',sort:true,formatter:function(c){return gridjs.html('<span class="ls-cell">'+c+'</span>');}},
      {id:'score',name:'Score',sort:false,formatter:function(c){return gridjs.html('<span class="sc-cell">'+c+'</span>');}},
      {id:'margin',name:'Margin',sort:true},
      {id:'total',name:'Total pts',sort:true},
      {id:'box',name:'Box',sort:true,formatter:function(c){return gridjs.html('<span class="dim-cell">Box '+c+'</span>');}},
    ],
    data:[],sort:{multiColumn:false},style:gjStyle
  }).render(document.getElementById('gj-sets'));
}

function refreshPlayerGrid(rows) {
  if (!_gjPlayers) return;
  _gjPlayers.updateConfig({data:rows.map(function(r){
    return [r.name, r.mt,r.mw,r.ml,r.mpct, r.tot,r.w,r.l,r.pct, r.pFor,r.pAg,r.diff];
  })}).forceRender();
}

function refreshSetsGrid(rows) {
  if (!_gjSets) return;
  _gjSets.updateConfig({data:rows.map(function(r){return [r.wPair,r.lPair,r.score,r.margin,r.total,r.box];})}).forceRender();
}

var _plMode='single';
function setPlMode(m) {

function setupSearch() {
  const inp=document.getElementById('pi'), dd=document.getElementById('pd');
  if (!inp||!dd) return;
  const {pst,pn,dates}=STATS;
  const all=Object.keys(pst).map(function(id){return {id:+id,name:pn[+id]||('#'+id),n:pst[+id].sess.size};}).sort(function(a,b){return a.name.localeCompare(b.name);});
  function show(f) {
    f=f||'';
    const m=all.filter(function(p){return p.name.toLowerCase().includes(f.toLowerCase());}).slice(0,25);
    if(!m.length){dd.style.display='none';return;}
    dd.innerHTML=m.map(function(p){return '<div class="popt" onclick="selPl('+p.id+',\''+p.name.replace(/'/g,"\\'")+'\'">'+p.name+' <span style="color:var(--t3);font-size:10px">'+p.n+'/'+dates.length+'×</span></div>';}).join('');
    dd.style.display='block';
  }
  inp.addEventListener('focus',function(){show(inp.value);});
  inp.addEventListener('input',function(){show(inp.value);});

}
function selPl(id,name) {
  document.getElementById('pi').value=name;
  document.getElementById('pd').style.display='none';
  renderPl(id);
}

function renderPl(pid) {
  const {dates,pn,pst,parst,vsst,rh,allSets}=STATS;
  const id=+pid, ps=pst[id]; if(!ps)return;
  const name=pn[id]||('Player '+id);
  const tot=ps.w+ps.l, pct=tot>0?(ps.w/tot*100).toFixed(1):0;
  const boxvals=dates.map(function(d){return ps.box[d]||null;});
  const rnk=rh[id]&&rh[id][dates[dates.length-1]];
  const dots=dates.map(function(d){
    const att=ps.sess.has(d);
    return '<div class="dot '+(att?'y':'n')+'" title="'+d+'">'+(att?(ps.box[d]||'·'):'–')+'</div>';
  }).join('');

  const parts=[];
  Object.keys(parst).forEach(function(k){
    const s=parst[k], ids=k.split(',').map(Number);
    if(!ids.includes(id))return;
    const pid2=ids.find(function(x){return x!==id;}); if(!pid2)return;
    const t=s.w+s.l; if(!t)return;
    parts.push({id:pid2,name:pn[pid2]||('#'+pid2),w:s.w,l:s.l,t:t,pct:s.w/t});
  });
  const opmap={};
  Object.keys(vsst).forEach(function(k){
    const parts2=k.split('_'), a=+parts2[0], b=+parts2[1];
    if(a!==id)return;
    if(!opmap[b])opmap[b]={w:0,l:0};
    opmap[b].w+=vsst[k].w; opmap[b].l+=vsst[k].l;
  });
  const opps=Object.keys(opmap).map(function(bid){
    const s=opmap[bid];
    return {id:+bid,name:pn[+bid]||('#'+bid),w:s.w,l:s.l,t:s.w+s.l,pct:s.w/(s.w+s.l)};
  });

  const hasRank=rh[id]&&Object.keys(rh[id]).length>0;
  const hasBox=boxvals.some(function(v){return v!==null;})&&ps.sess.size>1;

  const lastDates=dates.slice(-2);
  const formSets=allSets.filter(function(s){return lastDates.includes(s.date)&&(s.p1.includes(id)||s.p2.includes(id));});
  const formW=formSets.filter(function(s){return (s.p1.includes(id)&&s.s1>s.s2)||(s.p2.includes(id)&&s.s2>s.s1);}).length;
  const formPct=formSets.length?(formW/formSets.length*100).toFixed(0):null;
  const formDelta=formPct!==null?Math.round(+formPct-+pct):null;
  const formBadge=formDelta!==null?'<span style="font-size:12px;font-weight:500;color:'+(formDelta>=0?'var(--win)':'var(--loss)')+';margin-left:8px">'+(formDelta>=0?'↑':'↓')+' '+Math.abs(formDelta)+'% recent form</span>':'';

  document.getElementById('pdet').innerHTML=
    '<div class="pname">'+name+(rnk?' <span style="font-size:13px;color:var(--t3);font-weight:400">· Rank #'+rnk+'</span>':'')+formBadge+'</div>'+
    '<div class="cards">'+
      '<div class="card"><div class="card-lbl">Nights</div><div class="card-val">'+ps.sess.size+'<span style="font-size:13px;color:var(--t3)"> / '+dates.length+'</span></div></div>'+
      '<div class="card"><div class="card-lbl">Sets won</div><div class="card-val" style="color:var(--win)">'+ps.w+'</div></div>'+
      '<div class="card"><div class="card-lbl">Sets lost</div><div class="card-val" style="color:var(--loss)">'+ps.l+'</div></div>'+
      '<div class="card"><div class="card-lbl">Win rate</div><div class="card-val">'+pct+'%</div></div>'+
      '<div class="card"><div class="card-lbl">Pts For</div><div class="card-val">'+ps.ptsFor+'</div></div>'+
      '<div class="card"><div class="card-lbl">Pts Against</div><div class="card-val">'+ps.ptsAgainst+'</div><div class="card-sub">'+(ps.ptsFor-ps.ptsAgainst>=0?'+':'')+(ps.ptsFor-ps.ptsAgainst)+' diff</div></div>'+
    '</div>'+
    '<div style="font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:8px">Attendance &amp; box</div>'+
    '<div class="dots">'+dots+'</div>'+
    (hasRank?'<div class="cc"><div class="cc-ttl">Leaderboard rank over time</div><div id="c-rk" class="chart-wrap"></div></div>':'')+
    (hasBox?'<div class="cc"><div class="cc-ttl">Box position over time</div><div id="c-bx" class="chart-wrap"></div></div>':'')+
    '<div class="row2">'+
      '<div class="cc"><div class="cc-ttl">Partners</div><div id="tbl-prt"></div></div>'+
      '<div class="cc"><div class="cc-ttl">Opponents</div><div id="tbl-opp"></div></div>'+
    '</div>';
  document.getElementById('pdet').classList.add('on');

  const pcols=[
    {label:'Name',val:function(r){return r.name;},cls:function(){return 'nm';},fmt:function(r){return r.name;}},
    {label:'W',val:function(r){return r.w;},cls:function(r){return r.w>r.l?'wn':'';}},
    {label:'L',val:function(r){return r.l;},cls:function(r){return r.l>r.w?'ls':'';}},
    {label:'Sets',val:function(r){return r.t;}},
    {label:'Win %',val:function(r){return r.pct;},fmt:function(r){return Math.round(r.pct*100)+'%';},cls:function(r){return r.pct>=.5?'wn':'ls';}},
  ];
  setTbl('tbl-prt',parts,pcols,4,-1);
  setTbl('tbl-opp',opps,pcols,4,-1);

  const th=pt();
  requestAnimationFrame(function(){
    if (hasRank) {
      const rkData=dates.map(function(d){return {date:d.slice(5),rank:rh[id]&&rh[id][d]||null};}).filter(function(d){return d.rank;});
      renderPlot('c-rk',Plot.plot({
        style:th.style, marginLeft:36, marginBottom:28, height:110,
        x:{label:null},
        y:{reverse:true,label:'rank',tickFormat:function(d){return '#'+d;},grid:true},
        marks:[
          Plot.line(rkData,{x:'date',y:'rank',stroke:th.acc,strokeWidth:2,curve:'monotone-x'}),
          Plot.dot(rkData,{x:'date',y:'rank',fill:th.acc,r:4,tip:true,title:function(d){return d.date+': #'+d.rank;}}),
          Plot.text(rkData,{x:'date',y:'rank',text:function(d){return '#'+d.rank;},dy:-10,fill:th.t2,fontSize:10})
        ]
      }));
    }
    if (hasBox) {
      const bxData=dates.map(function(d,i){return {date:d.slice(5),box:boxvals[i]};}).filter(function(d){return d.box;});
      const maxBox=Math.max.apply(null,boxvals.filter(Boolean));
      renderPlot('c-bx',Plot.plot({
        style:th.style, marginLeft:44, marginBottom:28, height:90,
        x:{label:null},
        y:{label:'box',tickFormat:function(d){return 'Box '+d;},grid:true,domain:[1,maxBox]},
        marks:[
          Plot.line(bxData,{x:'date',y:'box',stroke:th.acc,strokeWidth:2}),
          Plot.dot(bxData,{x:'date',y:'box',fill:th.acc,r:4,tip:true,title:function(d){return d.date+': Box '+d.box;}})
        ]
      }));
    }
  });
}

var _cmpIds=[];
function setupCmpSearch() {
  const inp=document.getElementById('ci'), dd=document.getElementById('cd');
  if(!inp||!dd)return;
  const {pst,pn}=STATS;
  const all=Object.keys(pst).map(function(id){return {id:+id,name:pn[+id]||('#'+id)};}).sort(function(a,b){return a.name.localeCompare(b.name);});
  function show(f) {
    f=f||'';
    const avail=all.filter(function(p){return !_cmpIds.includes(p.id)&&p.name.toLowerCase().includes(f.toLowerCase());}).slice(0,20);
    if(!avail.length){dd.style.display='none';return;}
    dd.innerHTML=avail.map(function(p){return '<div class="cmp-opt" onclick="cmpAdd('+p.id+',\''+p.name.replace(/'/g,"\\'")+'\')">'+p.name+'</div>';}).join('');
    dd.style.display='block';
  }
  inp.addEventListener('focus',function(){show(inp.value);});
  inp.addEventListener('input',function(){show(inp.value);});
  document.addEventListener('click',function(e){if(!e.target.closest('.cmp-wrap'))dd.style.display='none';});
}
function cmpAdd(id,name) {
  if (_cmpIds.length>=4||_cmpIds.includes(id)) return;
  _cmpIds.push(id);
  document.getElementById('ci').value='';
  document.getElementById('cd').style.display='none';
  renderCmp();
}
function cmpRemove(id) {
  _cmpIds=_cmpIds.filter(function(x){return x!==id;});
  renderCmp();
}
function renderCmp() {
  const {pn,pst,rh,dates}=STATS, th=pt();
  const HUES=[40,195,320,160,270,20,230,100];
  const colors=_cmpIds.map(function(_,i){return 'hsl('+HUES[i%HUES.length]+',65%,60%)';});
  document.getElementById('cmp-chips').innerHTML=_cmpIds.map(function(id,i){
    return '<button class="chip on" style="border-color:'+colors[i]+';color:'+colors[i]+';background:transparent" onclick="cmpRemove('+id+')">'+(pn[id]||('#'+id))+' ×</button>';
  }).join('');
  if (!_cmpIds.length) { document.getElementById('cmp-ct').innerHTML=''; return; }

  const rkRows=[];
  _cmpIds.forEach(function(id){
    dates.forEach(function(d){const r=rh[id]&&rh[id][d];if(r)rkRows.push({player:pn[id]||('#'+id),date:d.slice(5),rank:r});});
  });
  const barRows=_cmpIds.map(function(id){
    const p=pst[id]||{w:0,l:0}; const tot=p.w+p.l;
    return {player:pn[id]||('#'+id),pct:tot?p.w/tot*100:0,w:p.w,l:p.l};
  });

  const ct=document.getElementById('cmp-ct'); ct.innerHTML='';
  if (rkRows.length) {
    const lastLabel=dates[dates.length-1].slice(5);
    const rkPlot=Plot.plot({
      style:th.style, marginRight:120, height:220,
      x:{label:null,type:'band'},
      y:{reverse:true,label:'rank',tickFormat:function(d){return '#'+d;},grid:true},
      color:{domain:_cmpIds.map(function(id){return pn[id]||('#'+id);}),range:colors},
      marks:[
        Plot.line(rkRows,{x:'date',y:'rank',stroke:'player',strokeWidth:2,curve:'monotone-x'}),
        Plot.dot(rkRows,{x:'date',y:'rank',fill:'player',r:4,tip:true,title:function(d){return d.player+'\n'+d.date+': #'+d.rank;}}),
        Plot.text(rkRows.filter(function(r){return r.date===lastLabel;}),
          {x:'date',y:'rank',text:function(r){return '#'+r.rank+' '+r.player;},textAnchor:'start',dx:8,fontSize:10,fill:'player'})
      ]
    });
    const d=document.createElement('div'); d.className='cc';
    d.innerHTML='<div class="cc-ttl">Rank over time</div><div class="chart-wrap" id="c-cmp-rk"></div>';
    ct.appendChild(d); d.querySelector('#c-cmp-rk').appendChild(rkPlot);
  }
  const barPlot=Plot.plot({
    style:th.style, marginLeft:100, height:Math.max(80,_cmpIds.length*50),
    x:{label:'win %',tickFormat:function(d){return d+'%';},domain:[0,100]},
    y:{label:null},
    color:{domain:_cmpIds.map(function(id){return pn[id]||('#'+id);}),range:colors},
    marks:[
      Plot.barX(barRows,{y:'player',x:'pct',fill:'player',rx:3}),
      Plot.text(barRows,{y:'player',x:'pct',text:function(r){return Math.round(r.pct)+'%';},textAnchor:'start',dx:6,fill:th.t2,fontSize:11}),
      Plot.ruleX([50],{stroke:th.t3,strokeDasharray:'4 4'})
    ]
  });
  const d2=document.createElement('div'); d2.className='cc';
  d2.innerHTML='<div class="cc-ttl">Overall win %</div><div class="chart-wrap" id="c-cmp-bar"></div>';
  ct.appendChild(d2); d2.querySelector('#c-cmp-bar').appendChild(barPlot);
}

// ── H2H ─────────────────────────────────────────────────────────────
var _h2hMode='partners', _h2hMin=3, _h2hRows=[];
function h2hSetMode(m,btn) {
  _h2hMode=m;
  btn.closest('.h2h-mode').querySelectorAll('button').forEach(function(b){b.classList.remove('on');});
  btn.classList.add('on');
  document.getElementById('h2h-ttl').textContent=m==='partners'?'Partner win % heatmap':'Opponent win % heatmap';
  renderH2H();
}
function h2hSetMin(v) {
  _h2hMin=v; document.getElementById('h2h-min-lbl').textContent=v; renderH2H();
}

function renderH2H() {
  if (!STATS) return;
  const {parst,vsst,pn}=STATS, th=pt();
  const search=(document.getElementById('h2h-search')||{value:''}).value||'';
  const source=_h2hMode==='partners'?parst:vsst;
  _h2hRows=[];
  Object.keys(source).forEach(function(k){
    const s=source[k];
    const ids=k.split(/[,_]/).map(Number);
    const t=s.w+s.l; if(t<_h2hMin)return;
    const a=ids[0], b=ids[1];
    const na=pn[a]||('#'+a), nb=pn[b]||('#'+b);
    if(search&&!na.toLowerCase().includes(search.toLowerCase())&&!nb.toLowerCase().includes(search.toLowerCase()))return;
    _h2hRows.push({pa:na,pb:nb,idA:a,idB:b,w:s.w,l:s.l,t:t,pct:s.w/t});
  });
  const ct=document.getElementById('h2h-chart');
  if (!_h2hRows.length) { ct.innerHTML='<p style="color:var(--t3);padding:20px">No data matching filters</p>'; return; }

  const plot=Plot.plot({
    style:Object.assign({},th.style,{overflow:'auto'}),
    marginLeft:90, marginBottom:90,
    height:Math.min(600, _h2hRows.length*22+100),
    color:{scheme:_h2hMode==='partners'?'BuPu':'RdYlGn',domain:[0,1],label:'win %',legend:true,tickFormat:function(d){return Math.round(d*100)+'%';}},
    x:{label:null,tickRotate:45},
    y:{label:null},
    marks:[
      Plot.cell(_h2hRows,{
        x:'pb', y:'pa', fill:'pct',
        tip:true,
        title:function(r){return r.pa+' '+ (_h2hMode==='partners'?'&':'vs')+' '+r.pb+'\n'+r.w+'W – '+r.l+'L ('+Math.round(r.pct*100)+'%)';}
      }),
      Plot.text(_h2hRows,{x:'pb',y:'pa',text:function(r){return Math.round(r.pct*100)+'%';},fontSize:9,fill:function(r){return r.pct>.65||r.pct<.35?'white':'black';}})
    ]
  });

  ct.innerHTML=''; ct.appendChild(plot);

  var _lastHovRow=null;
  plot.addEventListener('pointermove',function(e){
    var cell=e.target&&e.target.closest('rect');
    if(!cell)return;
    var cx=plot._h2hCellMap&&plot._h2hCellMap.get(cell);
    if(cx)_lastHovRow=cx;
  });
  // simpler click: find row by matching rendered x/y positions
  plot.addEventListener('click',function(e){
    if (_lastHovRow) { showH2HDetail(_lastHovRow); return; }
    // fallback: find closest row by pointer position
    var svgEl=plot.querySelector('svg');
    if(!svgEl)return;
    var pt2=svgEl.createSVGPoint();
    pt2.x=e.clientX; pt2.y=e.clientY;
    var svgPt=pt2.matrixTransform(svgEl.getScreenCTM().inverse());
    // try all rects, find which one the click is inside
    var rects=Array.from(plot.querySelectorAll('rect[aria-label]'));
    // Observable Plot doesn't set aria-label on cell rects by default; fall back to first hovered
  });

  // better: attach click to each rendered rect using data index
  // Plot.cell renders rects in order of _h2hRows
  requestAnimationFrame(function(){
    var rects=Array.from(plot.querySelectorAll('rect')).filter(function(r){return +r.getAttribute('width')>5;});
    rects.forEach(function(rect,i){
      if(_h2hRows[i]){
        rect.style.cursor='pointer';
        rect.addEventListener('click',function(e){e.stopPropagation();showH2HDetail(_h2hRows[i]);});
      }
    });
  });
}

function showH2HDetail(r) {
  const {allSets,pn}=STATS;
  const verb=_h2hMode==='partners'?'with':'vs';
  const relevantSets=allSets.filter(function(s){
    if(_h2hMode==='partners')
      return (s.p1.includes(r.idA)&&s.p1.includes(r.idB))||(s.p2.includes(r.idA)&&s.p2.includes(r.idB));
    else
      return (s.p1.includes(r.idA)&&s.p2.includes(r.idB))||(s.p1.includes(r.idB)&&s.p2.includes(r.idA));
  });
  const rows2=relevantSets.map(function(s){
    const aIsP1=s.p1.includes(r.idA);
    const aScore=aIsP1?s.s1:s.s2, bScore=aIsP1?s.s2:s.s1;
    const aWon=aScore>bScore;
    return {date:s.date,result:aWon?'W':'L',score:Math.max(aScore,bScore)+'–'+Math.min(aScore,bScore),box:'Box '+s.bx};
  }).sort(function(a,b){return a.date<b.date?-1:1;});
  const det=document.getElementById('h2h-detail');
  det.innerHTML='<div class="cc-ttl">'+r.pa+' '+verb+' '+r.pb+' — '+r.w+'W '+r.l+'L ('+Math.round(r.pct*100)+'%)</div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Result</th><th>Score</th><th>Box</th></tr></thead>'+
    '<tbody>'+rows2.map(function(x){return '<tr><td>'+x.date+'</td><td class="'+(x.result==='W'?'wn':'ls')+'">'+x.result+'</td><td class="sc">'+x.score+'</td><td>'+x.box+'</td></tr>';}).join('')+'</tbody></table></div>';
  det.classList.add('on');
  det.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ── TABS + THEME ────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(function(btn){
  btn.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(b){b.classList.remove('on');});
    document.querySelectorAll('.sec').forEach(function(s){s.classList.remove('on');});
    btn.classList.add('on');
    document.getElementById('s-'+btn.dataset.tab).classList.add('on');
    if (btn.dataset.tab==='se'&&STATS) renderSe(STATS.dates[STATS.dates.length-1]);
    if (btn.dataset.tab==='h2'&&STATS) renderH2H();
  });
});
function toggleTheme() {
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark');
  if (!STATS) return;
  renderAttChart(); renderDistCharts(); renderBumpChart();
  renderH2H();
}

loadData();
</script>
