name: Back up prod database

# Nightly copy of prod's D1 to the private seminolas/club-backups repo (git
# history keeps every night). Sign-in sessions, verification rows and account
# secrets are left out (worker/src/backup.ts). GitHub emails on failure.
on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC: 3am NZ in summer, 2am in winter
  workflow_dispatch:

concurrency: backup-prod

jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      - name: Export prod D1
        run: npx wrangler d1 export club-prod --remote --output ../raw.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Leave out sign-in data
        run: npx tsx scripts/sanitize-backup.mts ../raw.sql ../club-prod.sql

      - name: Check out the backups repo
        uses: actions/checkout@v5
        with:
          repository: seminolas/club-backups
          ssh-key: ${{ secrets.BACKUPS_DEPLOY_KEY }}
          path: backups

      - name: Commit the backup
        working-directory: backups
        run: |
          cp ../club-prod.sql club-prod.sql
          git config user.name "club backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add club-prod.sql
          if git diff --cached --quiet; then
            echo "No changes since the last backup."
            exit 0
          fi
          git commit -q -m "Backup $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
          echo "Backed up: $(wc -c < club-prod.sql) bytes"
