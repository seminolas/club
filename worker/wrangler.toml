name = "club"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Bundles the shared rules for the browser (js/dist/rules.js, not committed)
# before every deploy, so a deploy can never ship a stale bundle.
[build]
command = "npm run build:web"

[assets]
directory = ".."          # repo root — serves index.html, js/, data/

[[d1_databases]]
binding = "DB"
database_name = "club-prod"
database_id = "dc014559-276f-4c9b-8aef-4071b4da9a3c"

[vars]
HC_CLUB_ID = "northlandbadminton"
HC_CLUB_SLUG = "northland-badminton"
BETTER_AUTH_URL = "https://club.vilhelmas-f78.workers.dev"

# Live session channel (S6a): one Durable Object per session.
[[durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRoom"]

[observability.logs]
enabled = true
invocation_logs = true

[env.staging]
name = "club-api-staging"

[env.staging.vars]
HC_CLUB_ID = "northlandbadminton"
HC_CLUB_SLUG = "northland-badminton"
BETTER_AUTH_URL = "https://club-api-staging.vilhelmas-f78.workers.dev"
# Email + password sign-in for the synthetic test accounts. Staging only:
# the Worker refuses to start it for any other URL.
TEST_LOGIN = "1"

[[env.staging.durable_objects.bindings]]
name = "SESSION_ROOM"
class_name = "SessionRoom"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "club-staging"
database_id = "ffcff689-6918-40f3-bde8-78502d18d0b5"
